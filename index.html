<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Local TTS Receiver</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="enableOverlay">
        <button id="enableAudioBtn" type="button">Click to enable TTS</button>
    </div>

    <div id="controls">
        <button id="muteBtn" type="button">Mute</button>
        <button id="skipBtn" type="button">Skip</button>
        <span id="modeBadge" class="mode-badge"></span>
        <label>
            Volume
            <input id="volumeSlider" type="range" min="0" max="100" value="80">
        </label>
        <label id="ttsModeWrap">
            TTS Mode
            <select id="ttsMode">
                <option value="server" selected>Server (Neural)</option>
                <option value="browser">Browser</option>
            </select>
        </label>
        <label id="serverVoiceWrap">
            Neural voice
            <select id="serverVoice"></select>
        </label>
        <label id="browserVoiceWrap">
            Browser voice
            <select id="browserVoice"></select>
        </label>
    </div>

    <div id="nowPlaying" class="now-playing">
        <span id="nowPlayingText"></span>
        <span id="queueInfo"></span>
    </div>

    <div id="engineLog"></div>

    <script>
        const engineLog = document.getElementById('engineLog');
        const muteBtn = document.getElementById('muteBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const skipBtn = document.getElementById('skipBtn');
        const ttsModeSelect = document.getElementById('ttsMode');
        const ttsModeWrap = document.getElementById('ttsModeWrap');
        const browserVoiceSelect = document.getElementById('browserVoice');
        const serverVoiceSelect = document.getElementById('serverVoice');
        const serverVoiceWrap = document.getElementById('serverVoiceWrap');
        const browserVoiceWrap = document.getElementById('browserVoiceWrap');
        const enableOverlay = document.getElementById('enableOverlay');
        const enableAudioBtn = document.getElementById('enableAudioBtn');
        const nowPlayingBox = document.getElementById('nowPlaying');
        const nowPlayingText = document.getElementById('nowPlayingText');
        const queueInfo = document.getElementById('queueInfo');
        const modeBadge = document.getElementById('modeBadge');

        const speechQueue = [];
        let isSpeaking = false;
        let isMuted = false;
        let audioEnabled = false;
        let currentAudio = null;
        let appConfig = null;
        let serverAudioMode = false;

        const settings = {
            muted: localStorage.getItem('ttsMuted') === 'true',
            volume: Number(localStorage.getItem('ttsVolume') ?? 80),
            mode: localStorage.getItem('ttsMode') ?? 'server',
            browserVoice: localStorage.getItem('ttsBrowserVoice') ?? '',
            serverVoice: localStorage.getItem('ttsServerVoice') ?? 'en-US-JennyNeural',
        };

        isMuted = settings.muted;
        volumeSlider.value = settings.volume;
        ttsModeSelect.value = settings.mode;

        function saveSettings() {
            localStorage.setItem('ttsMuted', String(isMuted));
            localStorage.setItem('ttsVolume', volumeSlider.value);
            localStorage.setItem('ttsMode', ttsModeSelect.value);
            localStorage.setItem('ttsBrowserVoice', browserVoiceSelect.value);
            localStorage.setItem('ttsServerVoice', serverVoiceSelect.value);
        }

        function updateMuteButton() {
            muteBtn.textContent = isMuted ? 'Unmute' : 'Mute';
            muteBtn.classList.toggle('muted', isMuted);
        }

        function getVolume() {
            return Number(volumeSlider.value) / 100;
        }

        function updateVoiceVisibility() {
            if (serverAudioMode) {
                ttsModeWrap.style.display = 'none';
                serverVoiceWrap.style.display = 'inline-flex';
                browserVoiceWrap.style.display = 'none';
                return;
            }
            const serverMode = ttsModeSelect.value === 'server';
            ttsModeWrap.style.display = '';
            serverVoiceWrap.style.display = serverMode ? 'inline-flex' : 'none';
            browserVoiceWrap.style.display = serverMode ? 'none' : 'inline-flex';
        }

        function applyServerConfig() {
            if (!appConfig) {
                return;
            }
            serverAudioMode = !!appConfig.audio_enabled;
            modeBadge.textContent = serverAudioMode ? 'Host audio' : 'Browser mode';
            modeBadge.classList.toggle('host-audio', serverAudioMode);

            isMuted = appConfig.audio.muted;
            volumeSlider.value = Math.round(appConfig.audio.volume * 100);
            updateMuteButton();

            updateVoiceVisibility();

            // In host-audio mode the browser never plays sound itself.
            enableOverlay.classList.toggle('hidden', serverAudioMode || audioEnabled);
        }

        async function fetchAppConfig() {
            try {
                const response = await fetch('api/config', { cache: 'no-store' });
                if (response.ok) {
                    appConfig = await response.json();
                    if (appConfig.tts_voice) {
                        settings.serverVoice = appConfig.tts_voice;
                    }
                }
            } catch (error) {
                appendEngineLog({
                    time: new Date().toLocaleTimeString(),
                    level: 'warn',
                    message: `Config API unavailable (${error.message}). Assuming browser mode.`,
                });
            }
            applyServerConfig();
        }

        function showNowPlaying(data) {
            nowPlayingText.textContent = `${data.user}: ${data.text}`;
            nowPlayingBox.classList.remove('now-playing-flash');
            void nowPlayingBox.offsetWidth;
            nowPlayingBox.classList.add('now-playing-flash');
        }

        function updateQueueInfo(size) {
            queueInfo.textContent = `Queue: ${size}`;
        }

        function appendEngineLog(entry) {
            const line = document.createElement('div');
            line.className = `log-${entry.level || 'info'}`;
            line.textContent = `[${entry.time}] ${entry.message}`;
            engineLog.appendChild(line);
            engineLog.scrollTop = engineLog.scrollHeight;

            while (engineLog.children.length > 100) {
                engineLog.removeChild(engineLog.firstChild);
            }
        }

        function flashForChatMessage() {
            document.body.classList.remove('chat-flash');
            void document.body.offsetWidth;
            document.body.classList.add('chat-flash');
        }

        function populateServerVoices(voices) {
            const englishVoices = voices.filter((voice) => voice.locale.startsWith('en-'));
            const list = englishVoices.length > 0 ? englishVoices : voices;

            serverVoiceSelect.innerHTML = '';
            list.forEach((voice) => {
                const option = document.createElement('option');
                option.value = voice.name;
                option.textContent = voice.label;
                serverVoiceSelect.appendChild(option);
            });

            if (settings.serverVoice) {
                serverVoiceSelect.value = settings.serverVoice;
            }
            if (!serverVoiceSelect.value && serverVoiceSelect.options.length > 0) {
                serverVoiceSelect.selectedIndex = 0;
            }
        }

        async function loadServerVoices() {
            try {
                const response = await fetch('api/voices', { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`Voice list failed (${response.status})`);
                }
                populateServerVoices(await response.json());
            } catch (error) {
                appendEngineLog({
                    time: new Date().toLocaleTimeString(),
                    level: 'warn',
                    message: `Voice API unavailable (${error.message}). Waiting for SSE voice list...`,
                });
            }
        }

        function loadBrowserVoices() {
            const voices = window.speechSynthesis.getVoices();
            browserVoiceSelect.innerHTML = '';

            voices.forEach((voice) => {
                const option = document.createElement('option');
                option.value = voice.name;
                option.textContent = `${voice.name} (${voice.lang})`;
                browserVoiceSelect.appendChild(option);
            });

            if (settings.browserVoice) {
                browserVoiceSelect.value = settings.browserVoice;
            }
        }

        async function unlockAudio() {
            audioEnabled = true;
            enableOverlay.classList.add('hidden');

            const silent = new Audio('data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAABhgC7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7//////////////////////////////////////////////////////////////////8AAAAATGF2YzU4LjEzAAAAAAAAAAAAAAAAJAAAAAAAAAAAAYYoRwmHAAAAAAD/+1DEAAAHAAGf9AAAIAAANIAAAAQAAAaAAAAD/+1DEAg/wAABpAAAACAAAD/AAAA');
            silent.volume = 0;
            try {
                await silent.play();
            } catch (error) {
                console.warn('Silent unlock failed:', error);
            }

            processQueue();
        }

        window.speechSynthesis.onvoiceschanged = loadBrowserVoices;
        loadBrowserVoices();
        loadServerVoices();
        updateMuteButton();
        updateVoiceVisibility();
        fetchAppConfig().then(connectEventSource);

        enableAudioBtn.addEventListener('click', unlockAudio);

        async function remoteControl(action, value) {
            try {
                const response = await fetch('api/control', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(value !== undefined ? { action, value } : { action }),
                });
                if (!response.ok) {
                    throw new Error(`Control failed (${response.status})`);
                }
                applyControlState(await response.json());
            } catch (error) {
                appendEngineLog({
                    time: new Date().toLocaleTimeString(),
                    level: 'warn',
                    message: `Remote control failed: ${error.message}`,
                });
            }
        }

        function applyControlState(state) {
            if (typeof state.muted === 'boolean') {
                isMuted = state.muted;
                updateMuteButton();
            }
            if (typeof state.volume === 'number') {
                volumeSlider.value = Math.round(state.volume * 100);
            }
        }

        muteBtn.addEventListener('click', () => {
            if (serverAudioMode) {
                remoteControl(isMuted ? 'unmute' : 'mute');
                return;
            }
            isMuted = !isMuted;
            updateMuteButton();

            if (isMuted) {
                speechQueue.length = 0;
                window.speechSynthesis.cancel();
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio = null;
                }
                isSpeaking = false;
            }

            saveSettings();
        });

        skipBtn.addEventListener('click', () => {
            if (serverAudioMode) {
                remoteControl('skip');
                return;
            }
            window.speechSynthesis.cancel();
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            isSpeaking = false;
            processQueue();
        });

        volumeSlider.addEventListener('input', () => {
            if (serverAudioMode) {
                remoteControl('volume', getVolume());
                return;
            }
            if (currentAudio) {
                currentAudio.volume = getVolume();
            }
            saveSettings();
        });

        ttsModeSelect.addEventListener('change', () => {
            updateVoiceVisibility();
            saveSettings();
        });

        browserVoiceSelect.addEventListener('change', saveSettings);

        async function remoteVoiceChange(voice) {
            try {
                const response = await fetch('api/voice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ voice }),
                });
                if (!response.ok) {
                    throw new Error(`Voice change failed (${response.status})`);
                }
                saveSettings();
            } catch (error) {
                appendEngineLog({
                    time: new Date().toLocaleTimeString(),
                    level: 'warn',
                    message: `Voice change failed: ${error.message}`,
                });
            }
        }

        serverVoiceSelect.addEventListener('change', () => {
            if (serverAudioMode) {
                remoteVoiceChange(serverVoiceSelect.value);
                return;
            }
            saveSettings();
        });

        function finishSpeaking() {
            isSpeaking = false;
            currentAudio = null;
            processQueue();
        }

        async function speakWithServer(text) {
            const voice = encodeURIComponent(serverVoiceSelect.value);
            const response = await fetch(
                `api/tts?text=${encodeURIComponent(text)}&voice=${voice}`
            );
            if (!response.ok) {
                throw new Error(`Server TTS failed (${response.status})`);
            }

            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            const audio = new Audio(url);
            audio.volume = getVolume();
            currentAudio = audio;

            await new Promise((resolve, reject) => {
                audio.onended = () => {
                    URL.revokeObjectURL(url);
                    resolve();
                };
                audio.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error('Audio playback failed'));
                };
                audio.play().catch(reject);
            });
        }

        function speakWithBrowser(text) {
            return new Promise((resolve, reject) => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                utterance.volume = getVolume();

                const selectedVoice = window.speechSynthesis
                    .getVoices()
                    .find((voice) => voice.name === browserVoiceSelect.value);
                if (selectedVoice) {
                    utterance.voice = selectedVoice;
                }

                utterance.onend = resolve;
                utterance.onerror = () => reject(new Error('Browser TTS failed'));
                window.speechSynthesis.speak(utterance);
            });
        }

        async function processQueue() {
            if (!audioEnabled || isSpeaking || isMuted || speechQueue.length === 0) {
                return;
            }

            isSpeaking = true;
            const messageText = speechQueue.shift();

            try {
                if (ttsModeSelect.value === 'server') {
                    await speakWithServer(messageText);
                } else {
                    await speakWithBrowser(messageText);
                }
            } catch (error) {
                appendEngineLog({
                    time: new Date().toLocaleTimeString(),
                    level: 'warn',
                    message: `Playback issue: ${error.message}`,
                });
                if (ttsModeSelect.value === 'server') {
                    try {
                        await speakWithBrowser(messageText);
                    } catch (fallbackError) {
                        appendEngineLog({
                            time: new Date().toLocaleTimeString(),
                            level: 'error',
                            message: `Fallback TTS failed: ${fallbackError.message}`,
                        });
                    }
                }
            } finally {
                finishSpeaking();
            }
        }

        function streamUrl() {
            const port = (appConfig && appConfig.stream_port) || 8081;
            const host = location.hostname || 'localhost';
            return `http://${host}:${port}`;
        }

        function connectEventSource() {
            const eventSource = new EventSource(streamUrl());

            eventSource.onmessage = (event) => {
                if (event.data.startsWith(':')) {
                    return;
                }

                const data = JSON.parse(event.data);

                if (data.type === 'log') {
                    appendEngineLog(data);
                    return;
                }

                if (data.type === 'voices') {
                    populateServerVoices(data.voices);
                    return;
                }

                if (data.type === 'voice') {
                    if (data.voice) {
                        serverVoiceSelect.value = data.voice;
                    }
                    return;
                }

                if (data.type === 'control') {
                    if (serverAudioMode) {
                        applyControlState(data);
                        updateQueueInfo(data.queue_size || 0);
                    }
                    return;
                }

                if (data.type === 'now_playing') {
                    showNowPlaying(data);
                    return;
                }

                if (data.type === 'queue') {
                    updateQueueInfo(data.size);
                    return;
                }

                if (data.type !== 'chat') {
                    return;
                }

                flashForChatMessage();

                appendEngineLog({
                    time: new Date().toLocaleTimeString(),
                    level: 'chat',
                    message: `${data.user}: ${data.text}`,
                });

                if (!serverAudioMode && !isMuted && data.text) {
                    speechQueue.push(data.text);
                    processQueue();
                }
            };

            eventSource.onerror = () => {
                appendEngineLog({
                    time: new Date().toLocaleTimeString(),
                    level: 'warn',
                    message: 'Connection to core engine broken. Retrying...',
                });
            };
        }
    </script>
</body>
</html>
